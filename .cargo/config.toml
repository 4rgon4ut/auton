[build]
target = "riscv64gc-unknown-none-elf"
rustflags = [
    '-Clink-arg=-Tsrc/lds/virt.lds'
]

[unstable]
# build-std = ["core", "compiler_builtins"]
build-std-features = ["compiler-builtins-mem"]

[target.riscv64gc-unknown-none-elf]
runner = [
    "qemu-system-riscv64",
    "-machine", "virt",
    "-cpu", "rv64",
    "-smp", "4",
    "-m", "128M",
    "-bios", "none",
    "-nographic",
    "-serial", "mon:stdio",
    "-dtb",
    "virt.dtb",
    "-kernel",
]
